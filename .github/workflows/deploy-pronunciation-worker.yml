name: Deploy Pronunciation worker

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "pronunciation-worker.js"
      - "wrangler-pronunciation.jsonc"
      - "package.json"
      - ".github/workflows/deploy-pronunciation-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check deployment credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare deployment credentials are missing."
          fi
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "openai=true" >> "$GITHUB_OUTPUT"
          else
            echo "openai=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY is not configured. Worker can deploy, but generated references will use the browser fallback until this secret is added."
          fi
      - name: Deploy worker
        if: steps.creds.outputs.cloudflare == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c wrangler-pronunciation.jsonc
      - name: Configure OpenAI secret
        if: steps.creds.outputs.cloudflare == 'true' && steps.creds.outputs.openai == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY -c wrangler-pronunciation.jsonc
      - name: Smoke test
        if: steps.creds.outputs.cloudflare == 'true'
        run: |
          curl --fail --silent --show-error 'https://apps-pronunciation-api.nirav2000-github.workers.dev/health'
          echo
