name: Deploy App Monitor Worker (requires Cloudflare credentials)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app-monitor-worker.js"
      - "app-monitor-repository-privacy.js"
      - "app-monitor-app-catalog.js"
      - "nvr-private-data.js"
      - "tests/nvr-private-data.test.mjs"
      - "tests/app-monitor-app-catalog.test.mjs"
      - "app-monitor-repository-privacy.test.mjs"
      - "notes/v1/server.js"
      - "notes/v1/inclass-family-bridge.js"
      - "notes/v1/inclass-family-bridge.test.mjs"
      - "notes/v1/cloud.test.mjs"
      - "notes/v1/text-edits.test.mjs"
      - "notes/v1/editor-binding.test.mjs"
      - "notes/v1/browser-smoke.test.mjs"
      - "notes/v1/identity-picker.js"
      - "notes/v1/index.js"
      - "notes/v1/ui.js"
      - "app-monitor-owner-data.js"
      - "app-monitor-owner-routes.js"
      - "app-monitor-owner-data.test.mjs"
      - "app-monitor-owner-routes.test.mjs"
      - "notifications/v1/providers.js"
      - "notifications/v1/r2-transport.js"
      - "app-monitor-notifications.js"
      - "wrangler-app-monitor.jsonc"
      - "package.json"
      - ".github/workflows/deploy-app-monitor-worker.yml"

permissions:
  contents: read

concurrency:
  group: deploy-app-monitor-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test Owner Console data layer
        run: |
          node --experimental-default-type=module --check app-monitor-repository-privacy.js
          node --experimental-default-type=module --check app-monitor-app-catalog.js
          node --experimental-default-type=module --test tests/app-monitor-app-catalog.test.mjs
          node --experimental-default-type=module --check nvr-private-data.js
          node --experimental-default-type=module --test tests/nvr-private-data.test.mjs
          node --experimental-default-type=module --check app-monitor-privacy.js
          node --experimental-default-type=module --test app-monitor-repository-privacy.test.mjs
          node --check app-monitor-owner-data.js
          node --check app-monitor-owner-routes.js
          node --check app-monitor-owner-ui.js
          node --check notes/v1/server.js
          node --check notes/v1/inclass-family-bridge.js
          node --experimental-default-type=module --test notes/v1/inclass-family-bridge.test.mjs
          node --check notes/v1/cloud.js
          node --check notes/v1/index.js
          node --check notes/v1/ui.js
          node --experimental-default-type=module --test notes/v1/cloud.test.mjs notes/v1/issue-title.test.mjs notes/v1/text-edits.test.mjs notes/v1/editor-binding.test.mjs
          node --test app-monitor-owner-data.test.mjs app-monitor-owner-routes.test.mjs
      - name: Real Chrome editor interaction tests
        run: |
          node --experimental-default-type=module --check notes/v1/identity-picker.js
          timeout 90s node --experimental-default-type=module --test notes/v1/browser-smoke.test.mjs
      - name: Check repository-local Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::Cloudflare deployment credentials are missing. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository Actions secrets."
            exit 1
          fi
      - name: Confirm mandatory Worker secrets by name only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler secret list --name apps-monitor-api --format json > "$RUNNER_TEMP/app-monitor-secret-names.json"
          node -e 'const fs=require("node:fs");const items=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/app-monitor-secret-names.json","utf8"));if(!Array.isArray(items)||!items.some(x=>x.name==="FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON")){console.error("App Monitor Firebase administrator credential is missing");process.exit(1)}console.log("Verified Firebase secret binding is present (value not accessed)")'
          node -e 'const fs=require("node:fs");const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/app-monitor-secret-names.json","utf8"));const names=new Set(a.map(x=>x.name));const available=["BIZ_CATALOG_GITHUB_TOKEN","REPOSITORY_PRIVACY_GITHUB_TOKEN","NOTES_GITHUB_ISSUES_TOKEN"].filter(x=>names.has(x));if(available.length)console.log("Biz private catalogue: candidate GitHub read token exists ("+available.join(", ")+"); access to private Biz repository is not verified");else console.log("::warning title=Biz catalogue credential missing::Set a BIZ_CATALOG_GITHUB_TOKEN Worker secret with Contents Read-only access to nirav2000/Biz to enable the passkey portfolio")'
      - name: Deploy dedicated worker
        if: steps.creds.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler whoami
          npx wrangler deploy -c wrangler-app-monitor.jsonc
      - name: Smoke test
        if: steps.creds.outputs.available == 'true'
        run: |
          # A successful Wrangler upload does not mean every Cloudflare edge
          # is immediately serving the new Worker. Verify the expected build
          # before asserting the freshly added routes.
          expected_build=$(node -p "require('fs').readFileSync('app-monitor-worker.js','utf8').match(/const WORKER_BUILD='([^']+)'/)[1]")
          deployed_build=''
          for attempt in $(seq 1 30); do
            health=$(curl --fail --silent --show-error \
              -H 'Cache-Control: no-cache' \
              "https://apps-monitor-api.nirav2000-github.workers.dev/health?release=${GITHUB_SHA}&attempt=$attempt" || true)
            deployed_build=$(node -p 'JSON.parse(process.argv[1]).build' "$health" 2>/dev/null || true)
            if [ "$deployed_build" = "$expected_build" ]; then
              echo "Verified current Worker build: $deployed_build"
              break
            fi
            echo "Edge still serving build ${deployed_build:-unknown}; expected $expected_build (attempt $attempt)"
            sleep 4
          done
          test "$deployed_build" = "$expected_build"
          echo
          curl --fail --silent --show-error 'https://apps-monitor-api.nirav2000-github.workers.dev/health'
          echo
          security_status=$(curl --fail --silent --show-error -H 'Origin: https://nirav2000.github.io' 'https://apps-monitor-api.nirav2000-github.workers.dev/app-monitor/security/status')
          node -e 'const x=JSON.parse(process.argv[1]);if(!x.ok||x.bootstrapNeeded||x.passkeyCount<1)throw Error("App Monitor passkey backend is not provisioned");console.log("Verified passkey backend is provisioned")' "$security_status"
          echo
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://nirav2000.github.io' 'https://apps-monitor-api.nirav2000-github.workers.dev/app-monitor/owner/data/dashboard')
          test "$code" = "401"
          echo
          notes_code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://nirav2000.github.io' 'https://apps-monitor-api.nirav2000-github.workers.dev/app-monitor/notes?appId=app-monitor')
          test "$notes_code" = "401"
          echo
          privacy_code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://nirav2000.github.io' 'https://apps-monitor-api.nirav2000-github.workers.dev/app-monitor/repository-privacy')
          echo "Repository privacy unauthed HTTP: $privacy_code"
          test "$privacy_code" = "401"
          # The new route can propagate to Cloudflare edges slightly after /health.
          catalogue_code=''
          for attempt in $(seq 1 12); do
            catalogue_code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://nirav2000.github.io' "https://apps-monitor-api.nirav2000-github.workers.dev/app-monitor/apps-catalog?release=$GITHUB_SHA&attempt=$attempt")
            echo "Private catalogue unauthenticated HTTP: $catalogue_code (attempt $attempt)"
            if [ "$catalogue_code" = "401" ]; then break; fi
            sleep 3
          done
          test "$catalogue_code" = "401"
          nvr_code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Origin: https://nirav2000.github.io' 'https://apps-monitor-api.nirav2000-github.workers.dev/app-monitor/nvr/activities')
          echo "Private NVR endpoint unauthenticated HTTP: $nvr_code"
          test "$nvr_code" = "401"
