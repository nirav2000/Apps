name: Deploy App Monitor Worker (requires Cloudflare credentials)

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "app-monitor-worker.js"
      - "notifications/v1/providers.js"
      - "notifications/v1/r2-transport.js"
      - "app-monitor-notifications.js"
      - "wrangler-app-monitor.jsonc"
      - "package.json"
      - ".github/workflows/deploy-app-monitor-worker.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check repository-local Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::error::Cloudflare deployment credentials are missing. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository Actions secrets."
            exit 1
          fi
      - name: Deploy dedicated worker
        if: steps.creds.outputs.available == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler whoami
          npx wrangler deploy -c wrangler-app-monitor.jsonc
      - name: Smoke test
        if: steps.creds.outputs.available == 'true'
        run: |
          curl --fail --silent --show-error 'https://apps-monitor-api.nirav2000-github.workers.dev/health'
          echo
          curl --fail --silent --show-error -H 'Origin: https://nirav2000.github.io' 'https://apps-monitor-api.nirav2000-github.workers.dev/app-monitor/security/status'
          echo
