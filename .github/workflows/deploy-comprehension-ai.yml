name: Deploy Comprehension Coach AI
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "comprehension-ai-worker.js"
      - "wrangler-comprehension.jsonc"
      - ".github/workflows/deploy-comprehension-ai.yml"
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check worker syntax
        run: node --check comprehension-ai-worker.js
      - name: Check Cloudflare credentials
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Cloudflare credentials missing. Configure repository secrets."; exit 1
          fi
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler deploy -c wrangler-comprehension.jsonc
      - name: Smoke health
        run: |
          for n in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 15 https://comprehension-coach-ai.nirav2000-github.workers.dev/health; then
              echo; exit 0;
            fi
            echo "Waiting for Worker route to become available ($n/12)";
            sleep 5;
          done
          echo "::error::Worker route did not become healthy"; exit 1
