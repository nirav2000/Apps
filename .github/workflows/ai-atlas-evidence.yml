name: AI Atlas evidence update
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ai-atlas/scripts/collect-openrouter.mjs'
      - '.github/workflows/ai-atlas-evidence.yml'
permissions:
  contents: read
concurrency:
  group: ai-atlas-evidence
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect dated public model catalog
        run: |
          node --check ai-atlas/scripts/collect-openrouter.mjs
          node ai-atlas/scripts/collect-openrouter.mjs
      - name: Verify raw snapshot structure
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const dir='ai-atlas/data/provider-snapshots';
          const files=fs.readdirSync(dir).filter(x=>x.endsWith('.json'));
          if(!files.length)throw Error('No collected snapshots');
          for(const file of files){
            const d=JSON.parse(fs.readFileSync(dir+'/'+file));
            if(!d.collectedAt||!Array.isArray(d.models)||d.models.length<20)throw Error('Invalid '+file);
          }
          JS
      - name: Commit new snapshot if available
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain -- ai-atlas/data/provider-snapshots)" ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add ai-atlas/data/provider-snapshots
            git commit -m 'data(ai-atlas): archive dated public model prices'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
