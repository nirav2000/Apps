name: Shared Learning SDK tests
on:
  push:
    branches: [main]
    paths:
      - 'learning/**'
      - 'learning-evidence/**'
      - 'french-teaching/**'
      - 'tests/french-course.test.mjs'
      - 'tests/french-extensions.test.mjs'
      - 'tests/french-dictionary.test.mjs'
      - 'tests/french-auth-context.test.mjs'
      - 'tests/french-guided.test.mjs'
      - 'tests/french-assessment.test.mjs'
      - 'tests/french-curriculum.test.mjs'
      - 'tests/french-study-timing.test.mjs'
      - 'tests/french-learning-path.test.mjs'
      - 'learning-sync/**'
      - 'tests/learning.test.mjs'
      - 'tests/learning-evidence.test.mjs'
      - 'tests/learning-sync.test.mjs'
      - 'platform/v1/index.js'
      - '.github/workflows/learning-tests.yml'
  pull_request:
    paths:
      - 'learning-evidence/**'
      - 'french-teaching/**'
      - 'tests/french-course.test.mjs'
      - 'tests/french-extensions.test.mjs'
      - 'tests/french-dictionary.test.mjs'
      - 'tests/french-auth-context.test.mjs'
      - 'tests/french-guided.test.mjs'
      - 'tests/french-assessment.test.mjs'
      - 'tests/french-curriculum.test.mjs'
      - 'tests/french-study-timing.test.mjs'
      - 'tests/french-learning-path.test.mjs'
      - 'tests/learning-evidence.test.mjs'
      - '.github/workflows/learning-tests.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check learning/v1/index.js
      - run: node --check learning-sync/v1/index.js
      - run: node --check learning-evidence/v1/index.js
      - run: node --check learning-evidence/v1/panel.js
      - run: node --check learning-evidence/v1/firestore-cloud.js
      - run: node --check french-teaching/v1/data.js
      - run: node --check french-teaching/v1/phonics.js
      - run: node --check french-teaching/v1/lexicon.js
      - run: node --check french-teaching/v1/dictionary.js
      - run: node --check french-teaching/v1/index.js
      - run: node --check french-teaching/v1/auth-context.js
      - run: node --check french-teaching/v1/magic10.js
      - run: node --check french-teaching/v1/guided-lessons.js
      - run: node --check french-teaching/v1/guided-ui.js
      - run: node --check learning-evidence/v1/assessment.js
      - run: node --check french-teaching/v1/assessment.js
      - run: node --check french-teaching/v1/assessment-ui.js
      - run: node --test tests/learning.test.mjs tests/learning-sync.test.mjs tests/learning-evidence.test.mjs tests/french-course.test.mjs tests/french-extensions.test.mjs tests/french-dictionary.test.mjs tests/french-auth-context.test.mjs tests/french-guided.test.mjs tests/french-assessment.test.mjs tests/french-curriculum.test.mjs tests/french-study-timing.test.mjs tests/french-learning-path.test.mjs tests/french-expansion.test.mjs tests/french-practice-manager.test.mjs tests/french-journey.test.mjs
