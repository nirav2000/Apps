name: Shared static app validation

on:
  workflow_call:
    inputs:
      config:
        description: Validation config path in the consuming repository
        required: false
        type: string
        default: validation.config.json

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: app
      - name: Checkout shared validators
        uses: actions/checkout@v4
        with:
          repository: nirav2000/Apps
          ref: main
          path: shared-apps
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser validator
        run: npm install --prefix shared-apps --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx --prefix shared-apps playwright install --with-deps chromium
      - name: Recursive syntax, data and structure validation
        run: node shared-apps/validation/validate-static-app.mjs app "${{ inputs.config }}"
      - name: Browser smoke test
        run: node shared-apps/validation/smoke-test.mjs app "${{ inputs.config }}"
