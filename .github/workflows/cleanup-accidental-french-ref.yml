name: One-time cleanup of redundant French development ref
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-accidental-french-ref.yml'
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'nirav2000/Apps' && github.ref == 'refs/heads/main' && github.event.before == '00d5e8aa2549f50bd88a560dffca8c0e557ba955'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify no unique work and delete only the exact redundant ref
        shell: bash
        run: |
          set -euo pipefail
          ref='refs/heads/french-adaptive-repetition-v2'
          expected='91b3334cd03effa2306cc36e3451d76f42ea735e'
          actual=$(git ls-remote --heads origin "$ref" | awk '{print $1}')
          if [ -z "$actual" ]; then exit 0; fi
          test "$actual" = "$expected"
          git merge-base --is-ancestor "$actual" "$GITHUB_SHA"
          git push --force-with-lease="$ref:$expected" origin ":$ref"
