name: Shared Diagnostics deployed smoke
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify actual published files
        run: |
          set -e
          base=https://nirav2000.github.io/Apps/diagnostics
          for path in / /review.mjs /v1/core.mjs /v1/runtime.mjs /v1/index.mjs /releases/1.0.0/index.mjs; do
            curl --fail --location --retry 8 --retry-delay 3 --retry-all-errors --silent --show-error "$base$path" -o /tmp/diag-live
            test -s /tmp/diag-live
            if [ "$path" = / ]; then grep -q 'Shared Diagnostics' /tmp/diag-live; fi
          done
          echo 'Live Apps diagnostics assets available.'
