name: Benchmark comprehension AI candidates
on:
  push:
    branches: ["main"]
    paths:
      - "comprehension-ai-benchmark.mjs"
      - ".github/workflows/benchmark-comprehension-ai.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Benchmark synthetic 11+ answer only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node comprehension-ai-benchmark.mjs
