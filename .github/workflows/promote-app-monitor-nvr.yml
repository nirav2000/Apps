name: Promote verified App Monitor NVR API version
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-app-monitor-nvr.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-app-monitor-worker
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate private NVR routes before promotion
        run: |
          npm install --no-audit --no-fund
          node --check app-monitor-worker.js
          node --check nvr-private-data.js
          node --test tests/nvr-private-data.test.mjs
          node --test tests/app-monitor-app-catalog.test.mjs
      - name: Promote verified and complete NVR Worker version to 100%
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # This version was uploaded by the regular Worker workflow and verified using
          # the version-specific preview URL. It contains NVR and all required bindings.
          version='0bb46ca0-65bc-4b45-b8e8-1ab55f31352d'
          npx wrangler versions view "$version" --name apps-monitor-api --json > /tmp/nvr-verified-version.json
          node -e 'const v=require("/tmp/nvr-verified-version.json");const s=JSON.stringify(v.resources);for(const n of ["FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON","APP_MONITOR_DATA","BIZ_CATALOG_GITHUB_TOKEN"]){if(!s.includes(n))throw Error("Verified Worker version missing required binding: "+n)}console.log("Verified three required binding names; values not inspected")'
          preview=$(curl --silent --show-error --fail \
            'https://0bb46ca0-apps-monitor-api.nirav2000-github.workers.dev/health')
          node -e 'const d=JSON.parse(process.argv[1]);if(d.build!=="2026.11.09.nvr-private-v1"||!d.r2Bound)throw Error("NVR preview version is not healthy");console.log("Verified NVR preview build and R2 binding")' "$preview"
          echo "Promoting validated NVR Worker version $version to 100% of traffic"
          npx wrangler versions deploy "$version@100%" --name apps-monitor-api --yes -c wrangler-app-monitor.jsonc
          echo "NVR Worker version promoted to 100%; verify the /health release build below."
      - name: Confirm live protected NVR endpoint
        shell: bash
        run: |
          set -euo pipefail
          expected='2026.11.09.nvr-private-v1'
          for attempt in $(seq 1 30); do
            json=$(curl --silent --show-error --fail \
              "https://apps-monitor-api.nirav2000-github.workers.dev/health?release=$GITHUB_SHA&attempt=$attempt" || true)
            build=$(node -p 'JSON.parse(process.argv[1]).build' "$json" 2>/dev/null || true)
            if [ "$build" = "$expected" ]; then
              code=$(curl --silent --show-error -o /dev/null -w '%{http_code}' -H 'Origin: https://nirav2000.github.io' \
                "https://apps-monitor-api.nirav2000-github.workers.dev/app-monitor/nvr/activities?attempt=$attempt")
              echo "Live Worker version $build; unauthenticated NVR status $code"
              test "$code" = '401'
              exit 0
            fi
            echo "Live Worker build is $build; awaiting $expected (attempt $attempt)"
            sleep 3
          done
          echo "::error::Worker still serves the previous build after promotion; inspect Cloudflare Workers deployments."
          exit 1
