name: Shared release safeguards self-test
on:
  push:
    branches: [main]
    paths:
      - 'validation/release-v2/**'
      - '.github/workflows/release-safeguards-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ESLint
        run: npm install --prefix validation/release-v2 --no-save eslint@9.39.1 playwright@1.55.0
      - name: Run quality unit tests
        run: node --test validation/release-v2/quality.test.mjs
      - name: Check JS syntax
        run: |
          node --check validation/release-v2/quality.mjs
          node --check validation/release-v2/browser.mjs
