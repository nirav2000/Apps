name: Validate shared notifications

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "notifications/**"
      - "app-monitor.html"
      - "app-monitor-worker.js"
      - "app-monitor-notifications-client.js"
      - "app-monitor-notifications.js"
      - "notifications/v1/INSTALLATION.md"
      - "NOTIFICATIONS_SETUP.md"
      - "THIRD_PARTY_SERVICES.md"
      - "firebase-messaging-sw.js"
      - "platform/v1/index.js"
      - "shared-libraries.json"
      - ".github/workflows/notifications-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generic policy tests
        run: node notifications/v1/policy.test.mjs

      - name: R2 production transport test
        run: node notifications/v1/r2-transport.test.mjs

      - name: JavaScript syntax
        run: |
          node --check notifications/v1/index.js
          node --check notifications/v1/policy.js
          node --check notifications/v1/ui.js
          node --check notifications/v1/providers.js
          node --check notifications/v1/push.js
          node --check notifications/v1/memory-transport.js
          node --check notifications/v1/r2-transport.js
          node --check notifications/v1/lab.js
          node --check app-monitor-notifications.js
          node --check app-monitor-notifications-client.js

      - name: Lab wiring
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('notifications/v1/lab.html','utf8');
          if(!html.includes('./lab.js?v=1')) throw new Error('Notifications Lab script missing');
          const lower=html.toLowerCase();
          if(!lower.includes('delivery log')||!lower.includes('event simulator')) throw new Error('Notifications Lab core surfaces missing');
          const lab=fs.readFileSync('notifications/v1/lab.js','utf8');
          if(!lab.includes('createNotifications')||!lab.includes('createMemoryTransport')) throw new Error('Lab is not consuming the shared notification module');
          if(!lab.includes('mountRecipientPreferences')||!lab.includes('mountRoleNotificationPolicy')||!lab.includes('mountMemberNotificationSettings')) throw new Error('Lab is not exercising reusable shared UI');
          const worker=fs.readFileSync('firebase-messaging-sw.js','utf8');
          if(!worker.includes('firebase-messaging-compat.js')) throw new Error('Shared Firebase messaging worker missing');
          const push=fs.readFileSync('notifications/v1/push.js','utf8');
          if(!push.includes('firebase-messaging.js')||!push.includes('onRegistered')) throw new Error('Shared push client is not using FCM FID registration');
          NODE

      - name: Independence invariants
        run: |
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const files=[];
          function walk(dir){
            for(const name of fs.readdirSync(dir)){
              const p=path.join(dir,name),s=fs.statSync(p);
              if(s.isDirectory())walk(p);
              else if(/\.(js|html|css|mjs)$/.test(name))files.push(p);
            }
          }
          walk('notifications/v1');
          const forbidden=[
            ['Snag',/\bsnag\b/i],
            ['homeowner',/\bhomeowner\b/i],
            ['builder',/\bbuilder\b/i],
            ['contractor',/\bcontractor\b/i],
            ['App Monitor',/app[ -]?monitor/i]
          ];
          for(const file of files){
            const text=fs.readFileSync(file,'utf8');
            for(const [label,re] of forbidden){
              if(re.test(text)) throw new Error(file+' contains app-specific shared-module term: '+label);
            }
          }
          const install=fs.readFileSync('notifications/v1/INSTALLATION.md','utf8');
          for(const phrase of ['Minimal-diff rule','Instructions specifically for ChatGPT / AI','Definition of done','rollback the consuming app','Third-party service approval']){
            if(!install.includes(phrase)) throw new Error('Installation guide missing required contract: '+phrase);
          }
          const providers=fs.readFileSync('notifications/v1/providers.js','utf8');
          if(providers.includes('ONESIGNAL_APP_ID')||providers.includes('api.onesignal.com')) throw new Error('OneSignal must not be active in the default Notifications stack');
          if(!providers.includes('Firebase Cloud Messaging (FCM)')||!providers.includes('FCM_PROJECT_ID')) throw new Error('FCM is not the default push provider');
          if(providers.includes('destination.slackWebhookUrl')||providers.includes('destination.discordWebhookUrl')||providers.includes('destination.signalWebhookUrl')) throw new Error('User-controlled provider webhook detected');
          NODE

      - name: App Monitor integration invariants
        run: |
          node <<'NODE'
          const fs=require('fs');
          const server=fs.readFileSync('app-monitor-notifications.js','utf8');
          const client=fs.readFileSync('app-monitor-notifications-client.js','utf8');
          const worker=fs.readFileSync('app-monitor-worker.js','utf8');
          const html=fs.readFileSync('app-monitor.html','utf8');
          if(!server.includes("from './notifications/v1/r2-transport.js'")) throw new Error('App Monitor server adapter is not using shared R2 transport');
          if(!server.includes("'security.new_human'")||!server.includes('observeAppMonitorSession')) throw new Error('App Monitor new-human event adapter missing');
          if(!client.includes("from'./notifications/v1/index.js'")&&!client.includes("from './notifications/v1/index.js'")) throw new Error('App Monitor browser adapter is not using shared Notifications SDK');
          for(const helper of ['mountRecipientPreferences','mountDeliveryDestinations','mountNotificationInbox','showNotificationToast']){
            if(!client.includes(helper)) throw new Error('App Monitor browser adapter missing shared helper '+helper);
          }
          if(!worker.includes("from './app-monitor-notifications.js'")||!worker.includes('observeAppMonitorSession(env,snapshot)')) throw new Error('App Monitor Worker notification hooks missing');
          if(!worker.includes('App Monitor notification observation failed')) throw new Error('Notification observation must remain best-effort');
          if(!html.includes('appMonitorNotificationsRoot')||!html.includes("import('./app-monitor-notifications-client.js?v=1')")) throw new Error('App Monitor notification mount missing');
          for(const forbidden of ['TWILIO_ACCOUNT_SID','RESEND_API_KEY','SLACK_WEBHOOK_URL']){
            if(server.includes(forbidden)||client.includes(forbidden)) throw new Error('Provider-specific secret logic leaked into App Monitor adapter: '+forbidden);
          }
          NODE

      - name: Consumer UI safety
        run: |
          node <<'NODE'
          const fs=require('fs');
          const ui=fs.readFileSync('notifications/v1/ui.js','utf8');
          if(!ui.includes('developerSetup = false')) throw new Error('Recipient UI must hide developer/provider setup by default');
          if(!ui.includes('developerSetup && setupRequired')) throw new Error('Provider setup action is not developer-gated');
          if(!ui.includes('mountConsumerNotificationActivation')) throw new Error('Shared consumer activation component missing');
          const install=fs.readFileSync('notifications/v1/INSTALLATION.md','utf8');
          if(!install.includes('Recipient-facing notification UI must never expose provider setup')) throw new Error('Consumer safety installation rule missing');
          NODE

      - name: Consumer push registry
        run: |
          node <<'NODE'
          const fs=require('fs');
          const push=fs.readFileSync('notifications/v1/push.js','utf8');
          const worker=fs.readFileSync('app-monitor-worker.js','utf8');
          if(!push.includes('registerConsumerWebPush'))throw new Error('Shared consumer registration client missing');
          if(!worker.includes('/notifications/consumer/register'))throw new Error('Consumer device registration endpoint missing');
          if(!worker.includes('/notifications/consumer/deliver'))throw new Error('Protected consumer delivery endpoint missing');
          if(worker.indexOf("if(!notificationBridgeAuthorised(request,env))")>worker.indexOf("/notifications/consumer/deliver"))throw new Error('Consumer delivery must remain behind trusted bridge authentication');
          NODE



      - name: Shared registration
        run: |
          node <<'NODE'
          const fs=require('fs');
          const platform=fs.readFileSync('platform/v1/index.js','utf8');
          if(!platform.includes("notifications:{src:'notifications/v1/index.js'")) throw new Error('Notifications missing from Apps Platform');
          const libs=JSON.parse(fs.readFileSync('shared-libraries.json','utf8'));
          const n=libs.libraries.find(x=>x.id==='notifications-v1');
          if(!n||n.status!=='implemented') throw new Error('Notifications missing from shared library registry');
          if(n.installed?.Snag==='installed') throw new Error('Registry incorrectly claims Snag adoption');
          if(n.installed?.['App Monitor']!=='installed') throw new Error('Registry must record App Monitor notification adoption');
          if(n.installed?.['Notifications Lab']!=='installed') throw new Error('Registry must retain Notifications Lab adoption');
          console.log('Notifications v1 is registered with Lab and App Monitor adoption.');
          NODE
