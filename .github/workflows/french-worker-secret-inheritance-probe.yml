name: Diagnose existing App Monitor secret inheritance (no deployment)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/french-worker-secret-inheritance-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Inspect active version and stage without required-secret metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # Inspect only secret NAMES, never values or the service-account JSON.
          npx wrangler deployments list --name apps-monitor-api --json > "$RUNNER_TEMP/active-deployments.json"
          active=$(node -e 'const fs=require("fs"),d=JSON.parse(fs.readFileSync(process.argv[1],"utf8")).at(-1);const a=(d?.versions||[]).filter(x=>x.percentage>0);if(a.length!==1||a[0].percentage!==100)throw Error("Active Worker not at 100%");process.stdout.write(a[0].version_id)' "$RUNNER_TEMP/active-deployments.json")
          npx wrangler versions view "$active" --name apps-monitor-api --json > "$RUNNER_TEMP/active-worker.json"
          node -e 'const fs=require("fs"),x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const s=JSON.stringify(x.resources||{});for(const k of ["FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON","BIZ_CATALOG_GITHUB_TOKEN","APP_MONITOR_DATA"]){if(!s.includes(k))throw Error("Existing active Worker has no binding named "+k)}console.log("Existing active Worker contains all required binding names (values not inspected)")' "$RUNNER_TEMP/active-worker.json"

          # Wrangler's secrets.required validation disagrees with active-version
          # metadata. Remove that declaration only from this temporary probe config.
          # The committed production configuration and Worker stay unchanged.
          node -e 'const fs=require("fs");const p="wrangler-app-monitor.jsonc",v=JSON.parse(fs.readFileSync(p,"utf8"));delete v.secrets;fs.writeFileSync(".wrangler-french-probe.jsonc",JSON.stringify(v,null,2))'
          trap 'rm -f .wrangler-french-probe.jsonc' EXIT
          tag="french-secret-probe-$(printf '%.12s' "$GITHUB_SHA")"
          npx wrangler versions upload -c .wrangler-french-probe.jsonc --tag "$tag" --message "Non-promoting Firebase secret inheritance diagnostic"
          npx wrangler versions list --name apps-monitor-api --json > "$RUNNER_TEMP/probe-versions.json"
          candidate=$(node -e 'const fs=require("fs"),x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const a=x.filter(v=>v.annotations?.["workers/tag"]===process.argv[2]);if(a.length!==1)throw Error("Expected exactly one probe version");process.stdout.write(a[0].id)' "$RUNNER_TEMP/probe-versions.json" "$tag")
          npx wrangler versions view "$candidate" --name apps-monitor-api --json > "$RUNNER_TEMP/probe-worker.json"
          node -e 'const fs=require("fs"),x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));const s=JSON.stringify(x.resources||{});for(const k of ["FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON","BIZ_CATALOG_GITHUB_TOKEN","APP_MONITOR_DATA"]){if(!s.includes(k))throw Error("STAGED PROBE MISSING BINDING: "+k)}console.log("PASS: Non-promoted candidate inherited all existing binding names.")' "$RUNNER_TEMP/probe-worker.json"
          echo "Probe version staged and checked; NO production promotion was attempted."
