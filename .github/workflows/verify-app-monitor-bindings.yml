name: Verify App Monitor Firebase bindings (names only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-app-monitor-bindings.yml'
  schedule:
    - cron: '19 6 * * *'
permissions:
  contents: read
concurrency:
  group: verify-app-monitor-bindings
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cloudflare Worker credential names without reading values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.86.0 secret list --name apps-monitor-api --format json > "$RUNNER_TEMP/app-monitor-secret-names.json"
          node -e 'const fs=require("node:fs");const a=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/app-monitor-secret-names.json","utf8"));if(!Array.isArray(a)||!a.some(x=>x.name==="FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON"))throw Error("App Monitor Firebase service-account binding missing from production Cloudflare account");console.log("Production Firebase binding present (value not inspected)")'
      - name: Verify live App Monitor passkey provisioning
        run: |
          set -euo pipefail
          status=$(curl --fail --silent --show-error -H 'Origin: https://nirav2000.github.io' https://apps-monitor-api.nirav2000-github.workers.dev/app-monitor/security/status)
          node -e 'const x=JSON.parse(process.argv[1]);if(!x.ok||x.bootstrapNeeded||x.passkeyCount<1)throw Error("App Monitor administrator passkey not provisioned");console.log("App Monitor passkey service provisioned")' "$status"
