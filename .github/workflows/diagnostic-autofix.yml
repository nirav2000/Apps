name: Controlled diagnostic triage and verification
on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['automation/**', '.github/workflows/diagnostic-autofix.yml']
permissions:
  contents: read
  issues: write
  actions: read
concurrency:
  group: diagnostic-control-apps
  cancel-in-progress: false
jobs:
  investigate:
    if: vars.DIAGNOSTIC_AUTOFIX_PAUSED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate bounded diagnostic policy
        run: node --test automation/policy.test.mjs
      - name: Investigate new diagnostic reports
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node automation/triage.mjs
      - uses: actions/checkout@v4
        with:
          repository: nirav2000/Dol
          ref: main
          path: Dol-target
          persist-credentials: false
      - name: Install deployed browser verification tools
        run: |
          npm install --prefix Dol-target --no-save playwright@1.56.1
          cd Dol-target
          npx playwright install --with-deps chromium webkit
      - name: Independently verify deployment before resolving issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOL_CHECKOUT: Dol-target
        run: node automation/verify.mjs
      - name: Save investigation and deployed verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-diagnostic-evidence
          path: |
            artifacts/
            Dol-target/artifacts/
          if-no-files-found: ignore
